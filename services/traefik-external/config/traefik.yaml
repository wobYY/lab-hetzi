api:
  dashboard: false
  debug: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: https
          scheme: https

  https:
    address: ":443"

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    constraints: "Label(`externalproxy`,`true`)"

  file:
    filename: /config.yaml # example provided gives A+ rating https://www.ssllabs.com/ssltest/

certificatesResolvers:
  cloudflare:
    acme:
      # caServer: https://acme-v02.api.letsencrypt.org/directory # production (default)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging (testing)
      email: !!YOUR_EMAIL_HERE!!! # Cloudflare email (or other provider)
      storage: acme.json
      dnsChallenge:
        provider: cloudflare # change as required
        # disablePropagationCheck: true # Some people using Cloudflare note this can solve DNS propagation issues.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  maxSize: "15MB"
  maxBackups: 5
  maxAge: 14
  format: "json"
  level: "DEBUG"
  filePath: "/var/log/traefik/traefik_logs.json"

accessLog:
  format: "json"
  filePath: "/var/log/traefik/access_logs.json"